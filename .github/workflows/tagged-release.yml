name: Android Release APK

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build and publish
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and attach release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libarchive-tools
          ndk=$(sed -n 's/^NDK_VERSION=//p' scripts/fetch-proot.sh)
          if [ ! -d "$ANDROID_HOME/ndk/$ndk" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$ndk" >/dev/null
          fi

      - name: Fetch Linux runtime required by current upstream build
        run: scripts/fetch-proot.sh

      - name: Build FOSS release APK
        run: ./gradlew --no-daemon :app:assembleFossRelease

      - name: Prepare release files
        run: |
          mkdir -p release
          cp app/build/outputs/apk/foss/release/app-foss-release.apk release/omalauncher-lite.apk
          cd release
          sha256sum omalauncher-lite.apk > SHA256SUMS

      - name: Publish APK to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          name: Omalauncher Lite ${{ inputs.tag || github.ref_name }}
          generate_release_notes: true
          files: |
            release/omalauncher-lite.apk
            release/SHA256SUMS
