name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
      - name: Build release APK
        run: ./gradlew --no-daemon :app:assembleFossRelease
      - name: Prepare release assets
        run: |
          mkdir -p release
          cp app/build/outputs/apk/foss/release/app-foss-release.apk release/omalauncher-lite.apk
          cd release
          sha256sum omalauncher-lite.apk > SHA256SUMS
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release/omalauncher-lite.apk
            release/SHA256SUMS
